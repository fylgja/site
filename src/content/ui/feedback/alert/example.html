<button type="button" commandfor="alert-error" command="show-popover">Save changes</button>

<div id="alert-error" popover="manual" role="alert" class="toast alert fixed" data-type="error" style="--inset-t: 1rem; --inset-e: 1rem">
	<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
	Something went wrong. Your changes were not saved.
	<button type="button" commandfor="alert-error" command="hide-popover" aria-label="Dismiss">
		<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
	</button>
</div>
