<button type="button" commandfor="alert-offline" command="show-popover">Go offline</button>

<div id="alert-offline" popover="manual" role="alert" class="toast alert fixed" data-type="warning" style="--inset-t: 1rem; --inset-e: 1rem">
	<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
	You are offline. Changes sync once you reconnect.
	<button type="button" commandfor="alert-offline" command="hide-popover" aria-label="Dismiss">
		<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
	</button>
</div>
