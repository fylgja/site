<style>

		border: 1px solid color-mix(in oklab, var(--root-bg) 75%, var(--root-fg));

		background-color: color-mix(in oklab, var(--root-bg) 88%, white);
		color: var(--root-fg);
		box-shadow: 0 3px 5px hsl(0 0% 0% / 18%);

		@supports (position-area: block-end) {
			inset: auto;
			margin: 0.25rem 0;
			position-area: var(--menu-position, block-end span-inline-end);
			position-try-fallbacks: flip-block, flip-inline;
		}

</style>
