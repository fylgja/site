<div class="field">
	<label for="brand-color">Brand color</label>
	<color-field class="input-group">
		<input type="text" id="brand-color" name="brand" value="var(--brand)" autocomplete="off" spellcheck="false" aria-describedby="brand-color-hint" />
		<input type="color" class="flex-none" value="#6f31ed" aria-label="Pick the brand color" style="--block-size: auto" />
	</color-field>
	<small id="brand-color-hint" class="block">Any CSS color, like #6d28d9, oklch(50% 0.2 290), or var(--brand).</small>
</div>
