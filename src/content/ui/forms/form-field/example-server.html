<div class="field">
	<label for="field-coupon">Coupon code</label>
	<input
		type="text"
		id="field-coupon"
		name="coupon"
		value="SUMMER20"
		aria-invalid="true"
		aria-errormessage="field-coupon-error"
	/>
	<small id="field-coupon-error" class="field-error-message block">
		This coupon has expired.
	</small>
</div>
