<div class="field">
	<label for="field-email">Email</label>
	<input
		type="email"
		id="field-email"
		name="email"
		autocomplete="email"
		required
		aria-errormessage="field-email-error"
	/>
	<small id="field-email-error" class="field-error-message block">
		Enter an email address, like me@example.com.
	</small>
</div>
