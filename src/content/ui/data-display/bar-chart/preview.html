<table class="bar-chart w-full" style="--max: 3500">
	<caption class="text-start font-bold" style="--py: 0 0.5rem">Visitors by browser</caption>
	<thead>
		<tr class="grid">
			<th scope="col">Browser</th>
			<th scope="col">Visitors</th>
		</tr>
	</thead>
	<tbody>
		<tr class="grid">
			<th scope="row">Chrome</th>
			<td class="flex gap-sm" style="--value: 3120">3,120</td>
		</tr>
		<tr class="grid">
			<th scope="row">Safari</th>
			<td class="flex gap-sm" style="--value: 1840">1,840</td>
		</tr>
		<tr class="grid">
			<th scope="row">Firefox</th>
			<td class="flex gap-sm" style="--value: 960">960</td>
		</tr>
	</tbody>
</table>

<style>
	.bar-chart {
		--bar-color: var(--brand);
		--bar-size: 1.25rem;
		--bar-label-size: 6rem;
		--bar-value-size: 4rem;

		tr {
			grid-template-columns: var(--bar-label-size) 1fr;
			align-items: center;
		}

		:is(th, td) {
			padding: 0.25rem 0.5rem 0.25rem 0;
			border: 0;
			background: none;
		}

		thead {
			font-size: 0.875em;
			opacity: 0.7;
		}

		tbody td {
			align-items: center;
			font-variant-numeric: tabular-nums;

			&::before {
				content: "";
				flex: none;
				inline-size: calc(var(--value) / var(--max) * (100% - var(--bar-value-size)));
				block-size: var(--bar-size);
				border-radius: 0.25rem;
				background: var(--bar-color);
				transition: opacity 0.2s;
			}
		}

		tbody:has(tr:hover) tr:not(:hover) td::before {
			opacity: 0.4;
		}
	}
</style>
