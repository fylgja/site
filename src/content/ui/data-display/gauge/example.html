<div class="flex-wrap gap">
	<label class="gauge">
		CPU
		<meter min="0" max="100" low="70" high="90" optimum="0" value="59">59%</meter>
		<span aria-hidden="true">59%</span>
	</label>
	<label class="gauge">
		Memory
		<meter min="0" max="16" low="10" high="14" optimum="0" value="12.4">12.4 GB</meter>
		<span aria-hidden="true">12.4 GB</span>
	</label>
	<label class="gauge">
		Battery
		<meter min="0" max="100" low="20" high="50" optimum="100" value="14">14%</meter>
		<span aria-hidden="true">14%</span>
	</label>
</div>

<style>
	.gauge {
		--gauge-size: 8rem;
		--gauge-thickness: 22%;
		display: inline-grid;
		justify-items: center;
		gap: 0.25rem;

		span {
			font-weight: 700;
			font-variant-numeric: tabular-nums;
		}
	}

	@supports (width: attr(x type(<length>))) {
		.gauge {
			:is(meter, span) {
				grid-area: 1 / 1;
			}

			span {
				align-self: center;
				font-size: 1.25rem;
			}

			meter {
				--_min: attr(min type(<number>), 0);
				--_max: attr(max type(<number>), 1);
				--_value: clamp(var(--_min), attr(value type(<number>), 0), var(--_max));
				--_low: attr(low type(<number>), var(--_min));
				--_high: attr(high type(<number>), var(--_max));
				--_optimum: attr(optimum type(<number>), calc((var(--_min) + var(--_max)) / 2));
				--_fill: calc((var(--_value) - var(--_min)) / (var(--_max) - var(--_min)));
				/* Regions as the browser counts them: 0 below low, 1 between, 2 above high */
				--_region: calc(
					1 - max(0, sign(var(--_low) - var(--_value))) + max(0, sign(var(--_value) - var(--_high)))
				);
				--_best: calc(
					1 - max(0, sign(var(--_low) - var(--_optimum))) + max(0, sign(var(--_optimum) - var(--_high)))
				);
				--_distance: abs(var(--_region) - var(--_best));
				--_color: color-mix(
					in oklab,
					var(--error, #e00) calc(max(0, var(--_distance) - 1) * 100%),
					color-mix(
						in oklab,
						var(--warning, #ffb900) calc(min(1, var(--_distance)) * 100%),
						var(--success, #107c10)
					)
				);
				--_track: color-mix(in oklab, var(--root-bg) 85%, var(--root-fg));
				inline-size: var(--gauge-size);
				block-size: var(--gauge-size);
				margin-block-end: calc(var(--gauge-size) / -6);
				border-radius: 50%;
				background: conic-gradient(
					from -135deg,
					var(--_color) calc(var(--_fill) * 270deg),
					var(--_track) 0 270deg,
					transparent 0
				);
				mask: radial-gradient(
					closest-side,
					transparent calc(100% - var(--gauge-thickness)),
					#000 calc(100% - var(--gauge-thickness) + 1px)
				);

				&::-webkit-meter-bar {
					visibility: hidden;
				}
			}
		}
	}
</style>
