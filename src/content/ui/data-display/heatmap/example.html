<table class="heatmap w-full" style="--max: 40">
	<caption class="text-start font-bold" style="--py: 0 0.5rem">Deploys by weekday and time of day</caption>
	<thead>
		<tr>
			<td></td>
			<th scope="col">00:00</th>
			<th scope="col">04:00</th>
			<th scope="col">08:00</th>
			<th scope="col">12:00</th>
			<th scope="col">16:00</th>
			<th scope="col">20:00</th>
		</tr>
	</thead>
	<tbody>
		<tr>
			<th scope="row">Mon</th>
			<td style="--value: 2">2</td>
			<td style="--value: 6">6</td>
			<td style="--value: 28">28</td>
			<td style="--value: 36">36</td>
			<td style="--value: 31">31</td>
			<td style="--value: 9">9</td>
		</tr>
		<tr>
			<th scope="row">Tue</th>
			<td style="--value: 1">1</td>
			<td style="--value: 8">8</td>
			<td style="--value: 32">32</td>
			<td style="--value: 38">38</td>
			<td style="--value: 34">34</td>
			<td style="--value: 11">11</td>
		</tr>
		<tr>
			<th scope="row">Wed</th>
			<td style="--value: 3">3</td>
			<td style="--value: 7">7</td>
			<td style="--value: 30">30</td>
			<td style="--value: 40">40</td>
			<td style="--value: 29">29</td>
			<td style="--value: 8">8</td>
		</tr>
		<tr>
			<th scope="row">Thu</th>
			<td style="--value: 2">2</td>
			<td style="--value: 5">5</td>
			<td style="--value: 26">26</td>
			<td style="--value: 35">35</td>
			<td style="--value: 33">33</td>
			<td style="--value: 12">12</td>
		</tr>
		<tr>
			<th scope="row">Fri</th>
			<td style="--value: 1">1</td>
			<td style="--value: 4">4</td>
			<td style="--value: 22">22</td>
			<td style="--value: 27">27</td>
			<td style="--value: 15">15</td>
			<td style="--value: 6">6</td>
		</tr>
		<tr>
			<th scope="row">Sat</th>
			<td style="--value: 0">0</td>
			<td style="--value: 1">1</td>
			<td style="--value: 4">4</td>
			<td style="--value: 7">7</td>
			<td style="--value: 5">5</td>
			<td style="--value: 3">3</td>
		</tr>
		<tr>
			<th scope="row">Sun</th>
			<td style="--value: 0">0</td>
			<td style="--value: 0">0</td>
			<td style="--value: 2">2</td>
			<td style="--value: 5">5</td>
			<td style="--value: 8">8</td>
			<td style="--value: 4">4</td>
		</tr>
	</tbody>
</table>

<style>
	.heatmap {
		--heat-cold: color-mix(in oklab, var(--root-bg) 88%, var(--root-fg));
		--heat-hot: var(--brand);
		--heat-hot-text: var(--on-brand);
		--heat-cell-size: 2rem;
		table-layout: fixed;
		border-collapse: separate;
		border-spacing: 3px;

		:is(th, td) {
			padding: 0;
			border: 0;
			background: none;
			font-size: 0.75rem;
			text-align: center;
			font-variant-numeric: tabular-nums;
		}

		thead th {
			font-weight: 400;
		}

		thead :first-child {
			inline-size: 3rem;
		}

		tbody th {
			text-align: start;
		}

		tbody td {
			--_heat: calc(var(--value) / var(--max));
			block-size: var(--heat-cell-size);
			border-radius: 0.25rem;
			background: color-mix(in oklab, var(--heat-hot) calc(var(--_heat) * 100%), var(--heat-cold));
			/* round() switches to the hot text color once a cell passes half of --max */
			color: color-mix(in oklab, var(--heat-hot-text) calc(round(var(--_heat)) * 100%), var(--root-fg));

			&:hover {
				outline: 2px solid var(--root-fg);
				outline-offset: -1px;
			}
		}

		tr:has(td:hover) th {
			font-weight: 700;
		}
	}
</style>
